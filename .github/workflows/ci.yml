name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile downloader
        run: python -m py_compile scripts/baixar_artes.py

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
