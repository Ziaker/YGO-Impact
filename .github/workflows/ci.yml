name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python tools
        run: python -m py_compile scripts/baixar_artes.py scripts/sync_prototype_pool.py scripts/sync_prototype_pool_curated.py scripts/verify_context_sources.py

      - name: Verify canonical project sources
        run: python scripts/verify_context_sources.py

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  authoritative-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"

      - name: Install pinned TypeScript toolchain
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run core tests
        run: npm run test:core

      - name: Build core
        run: npm run build
