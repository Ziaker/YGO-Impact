name: Sync card art

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-card-art
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate downloader and pool policy
        run: |
          python -m py_compile scripts/baixar_artes.py scripts/sync_prototype_pool.py scripts/sync_prototype_pool_curated.py
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Select and download prototype card art
        run: |
          python scripts/sync_prototype_pool_curated.py \
            --prototype-pool \
            --output assets-local/card-art
