name: Sync card art

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/baixar_artes.py"
      - "scripts/sync_prototype_pool.py"
      - "tests/test_baixar_artes.py"
      - "tests/test_sync_prototype_pool.py"
      - ".github/workflows/sync-card-art.yml"
      - "docs/context/DEC-001-initial-card-pool.md"

permissions:
  contents: write

concurrency:
  group: sync-card-art
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate downloader and pool policy
        run: |
          python -m py_compile scripts/baixar_artes.py scripts/sync_prototype_pool.py
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Select and download prototype card art
        run: |
          python scripts/sync_prototype_pool.py \
            --prototype-pool \
            --output assets-local/card-art

      - name: Prune artwork outside current selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("assets-local/card-art")
          selection = json.loads((root / "selection.json").read_text(encoding="utf-8"))
          manifest_path = root / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          allowed_ids = {int(card["id"]) for card in selection["cards"]}
          files = manifest.setdefault("files", {})

          for relative_path, metadata in list(files.items()):
              try:
                  card_id = int(metadata.get("card_id"))
              except (TypeError, ValueError):
                  card_id = -1
              if card_id not in allowed_ids:
                  del files[relative_path]

          allowed_paths = set(files)
          removed = []
          for category in ("Monstros", "Magias", "Armadilhas"):
              category_root = root / category
              if not category_root.exists():
                  continue
              for path in category_root.rglob("*.jpg"):
                  relative_path = path.relative_to(root).as_posix()
                  if relative_path not in allowed_paths:
                      path.unlink()
                      removed.append(relative_path)

          for directory in sorted(
              (path for path in root.rglob("*") if path.is_dir()),
              key=lambda path: len(path.parts),
              reverse=True,
          ):
              try:
                  directory.rmdir()
              except OSError:
                  pass

          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"Artes antigas removidas: {len(removed)}")
          for relative_path in removed:
              print(f"  PRUNE {relative_path}")
          PY

      - name: Commit synchronized artwork and selection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f assets-local/card-art
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de arte/seleção para versionar."
            exit 0
          fi
          git commit -m "assets: sync prototype card pool"
          git push origin "HEAD:${GITHUB_REF_NAME}"
