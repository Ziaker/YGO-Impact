<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monster Impact · C2 Faixa Contextual</title><link rel="stylesheet" href="../shared.css"><style>
.context-panel{position:absolute;width:430px;height:194px;opacity:0;transform:translate(-50%,-50%) translateY(18px) scale(.9);transition:opacity .2s ease,transform .38s cubic-bezier(.2,.8,.2,1);background:linear-gradient(105deg,#071019f2,#102333ee);border:1px solid color-mix(in srgb,var(--accent) 58%,#36536a);border-radius:26px;box-shadow:0 24px 48px #000a;backdrop-filter:blur(14px);overflow:hidden}.overlay.shown .context-panel{opacity:1;transform:translate(-50%,-50%) scale(1)}.context-panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--accent)}

</style></head><body data-zoom="1.055"><div class="app"><header class="topbar"><div class="brand">MONSTER IMPACT</div><div class="variant">C2 · FAIXA CONTEXTUAL</div><div class="top-hint">Clique em uma unidade · setas trocam seleção · Esc fecha</div></header><main class="game"><div class="viewport"><div class="board-wrap"><div class="board"><div class="base ally">BASE</div><div class="base enemy">BASE</div></div></div></div><div class="overlay"><div id="context" class="context-panel"><div class="context-head"><div class="portrait-small"><img id="portrait" alt=""></div><div class="identity" id="identity"></div><div class="badges-mini" id="badges"></div></div><div class="context-body"><div class="stat-matrix" id="stats"></div><div class="context-effect" id="effect"></div></div></div></div><div class="controls-help"><b>Seleção:</b> clique numa unidade · <b>Teclado:</b> ← → / Esc</div><div class="variant-note"><b>C2 · Faixa Contextual</b> Uma cápsula compacta acompanha a unidade e ocupa só 430 × 194 px.</div></main></div><script>window.renderVariant=u=>{const box=document.getElementById("context");box.style.left=Math.max(20,Math.min(80,u.x))+"%";box.style.top=(u.y>48?Math.max(20,u.y-24):Math.min(78,u.y+28))+"%";document.getElementById("portrait").src=u.art;document.getElementById("identity").innerHTML=nameMeta(u);document.getElementById("badges").innerHTML=coreBadges(u);document.getElementById("stats").innerHTML=["hp","mp","atk","def","vis","spd"].map(k=>statChip(k,u.stats[k])).join("");document.getElementById("effect").innerHTML=effectBlock(u)};</script><script src="../shared.js"></script></body></html>
