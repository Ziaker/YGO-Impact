<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monster Impact · C3 Microdock</title><link rel="stylesheet" href="../shared.css"><style>
.microdock{position:absolute;left:50%;bottom:32px;width:min(660px,calc(100vw - 80px));height:150px;opacity:0;transform:translate(-50%,24px) scale(.94);transition:opacity .2s ease,transform .42s cubic-bezier(.2,.8,.2,1);display:grid;grid-template-columns:118px 1fr;gap:12px;padding:10px 12px;background:#071018ef;border:1px solid color-mix(in srgb,var(--accent) 60%,#36536a);border-radius:28px;box-shadow:0 24px 50px #000a;backdrop-filter:blur(16px)}.overlay.shown .microdock{opacity:1;transform:translate(-50%,0) scale(1)}
.dock-portrait{position:relative;border-radius:20px;overflow:hidden;border:2px solid var(--accent);background:#000}.dock-portrait img{width:100%;height:100%;object-fit:cover}.dock-portrait .dock-badges{position:absolute;left:5px;right:5px;bottom:5px;display:flex;justify-content:space-between;align-items:center}.dock-portrait .core-badge.race{width:30px;height:30px;padding:0}.dock-portrait .core-badge.race b{display:none}.dock-portrait .core-badge.level,.dock-portrait .core-badge.elem{width:30px;height:30px;border-radius:10px;font-size:11px}.dock-portrait .core-badge.elem{border-radius:50%}
.dock-main{min-width:0;display:grid;grid-template-rows:auto 42px 1fr;gap:7px}.dock-top{display:flex;justify-content:space-between;align-items:start;gap:8px}.dock-top .name{font-size:15px}.dock-top .kw-row{justify-content:flex-end;max-width:280px}.dock-top .kw{font-size:8px;padding:3px 6px}.dock-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.dock-stats .stat-chip{height:40px;min-width:0;padding:4px 6px;justify-content:center;border-radius:11px}.dock-stats .icon{width:17px;height:17px}.dock-stats .numbers{display:flex;align-items:center;gap:4px}.dock-stats .stat-label{font-size:7px}.dock-stats .stat-value{font-size:14px}.dock-effect{border-top:1px solid #ffffff11;padding-top:7px;overflow:hidden}.dock-effect .effect-copy{font-size:9.5px;line-height:1.25}
</style></head><body data-zoom="1.12"><div class="app"><header class="topbar"><div class="brand">MONSTER IMPACT</div><div class="variant">C3 · MICRODOCK DE FOCO</div><div class="top-hint">Clique em uma unidade · setas trocam seleção · Esc fecha</div></header><main class="game"><div class="viewport"><div class="board-wrap"><div class="board"><div class="base ally">BASE</div><div class="base enemy">BASE</div></div></div></div><div class="overlay"><div class="microdock" id="dock"><div class="dock-portrait"><img id="portrait" alt=""><div class="dock-badges" id="badges"></div></div><div class="dock-main"><div class="dock-top"><div id="identity"></div><div class="kw-row" id="keywords"></div></div><div class="dock-stats" id="stats"></div><div class="dock-effect" id="effect"></div></div></div></div><div class="controls-help"><b>Seleção:</b> clique numa unidade · <b>Teclado:</b> ← → / Esc</div><div class="variant-note"><b>C3 · Microdock de Foco</b> O zoom e o pulso fazem o foco; a ficha fica abaixo, pequena e estável.</div></main></div><script>window.renderVariant=u=>{document.getElementById("portrait").src=u.art;document.getElementById("badges").innerHTML=coreBadges(u);document.getElementById("identity").innerHTML=nameMeta(u);document.getElementById("keywords").innerHTML=u.keywords.map(keywordHtml).join("");document.getElementById("stats").innerHTML=["hp","mp","vis","spd","atk","def"].map(k=>statChip(k,u.stats[k])).join("");document.getElementById("effect").innerHTML=`<div class="effect-copy"><b>EFEITO</b> ${u.effect}</div>`};</script><script src="../shared.js"></script></body></html>
